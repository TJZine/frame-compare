[project]
name = "frame-compare"
version = "0.1.0"
description = "Video frame comparison tool with tonemapping and slow.pics integration"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [
    { name = "Tristan", email = "tristan@example.com" }
]
keywords = ["video", "comparison", "vapoursynth", "tonemapping", "hdr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]

dependencies = [
    "typer>=0.15.0",
    "rich>=13.9.0",
    "numpy>=2.2.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "structlog>=24.4.0",
    "anyio>=4.7.0",
    "tomli-w>=1.0.0",
    "pillow>=10.0.0",
    "guessit>=3.8.0",
    "anitopy>=2.1.1",
]

[project.scripts]
frame-compare = "frame_compare.cli_entry:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frame_compare"]

# ─── Dependency Groups (PEP 735) ───────────────────────────────────────────────
[dependency-groups]
dev = [
    "import-linter>=2.0.0",
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.0.0",
    "pyyaml>=6.0.2",
    "pyright>=1.1.390",
    "ruff>=0.8.0",
    "respx>=0.22.0",
]

# ─── Pyright ───────────────────────────────────────────────────────────────────
[tool.pyright]
pythonVersion = "3.13"
pythonPlatform = "All"
typeCheckingMode = "strict"
include = ["src"]
exclude = ["**/__pycache__", ".venv", "build", "dist"]
venvPath = "."
venv = ".venv"
reportMissingImports = true
reportMissingTypeStubs = false
reportMissingModuleSource = false
reportUnusedImport = true
reportUnusedVariable = true
reportPrivateUsage = true

# ─── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "C4"]
ignore = ["E501"]  # Line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["frame_compare"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ─── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "-q", "--strict-markers", "--strict-config"]
markers = [
    "unit: Fast isolated tests",
    "integration: Module interaction tests",
    "e2e: End-to-end CLI tests",
    "vs_required: Requires VapourSynth runtime",
    "slow: Long-running tests",
    "network: Requires network access",
    "tier_a: Contract/security tests (no VS, no network)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:vapoursynth",
]
anyio_mode = "auto"

# ─── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/frame_compare"]
branch = true
omit = ["*/__main__.py", "*/types.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
fail_under = 80
show_missing = true
