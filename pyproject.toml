[project]
name = "frame-compare"
version = "0.1.0"
description = "Video frame comparison tool with tonemapping and slow.pics integration"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.13"
authors = [
    { name = "Tristan", email = "zine96@proton.me" }
]
keywords = ["video", "comparison", "vapoursynth", "tonemapping", "hdr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]

dependencies = [
    "typer>=0.27.0",
    "rich>=14.2.0",
    "numpy>=2.4.6",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "structlog>=25.5.0",
    "tomli-w>=1.2.0",
    "pillow>=12.2.0",
    "guessit>=3.8.0",
    "anitopy>=2.1.1",
    "pyperclip>=1.11.0",
]

[project.optional-dependencies]
vspreview = [
    "vspreview",
]

[project.scripts]
frame-compare = "frame_compare.cli.entry:app"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frame_compare"]

# ─── Dependency Groups (PEP 735) ───────────────────────────────────────────────
[dependency-groups]
docs = [
    "zensical==0.0.51",
]
dev = [
    "anyio>=4.12.0",
    "bandit[toml]>=1.8.0",
    "import-linter>=2.9",
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "pytest-cov>=7.0.0",
    "pyyaml>=6.0.3",
    "pyright>=1.1.407",
    "nodejs-wheel-binaries>=24.16.0",
    "ruff>=0.14.10",
    "respx>=0.22.0",
    "pip-audit==2.10.1",
]

# ─── Pyright ───────────────────────────────────────────────────────────────────
[tool.pyright]
pythonVersion = "3.13"
pythonPlatform = "All"
typeCheckingMode = "strict"
include = ["src"]
exclude = ["**/__pycache__", ".venv", "build", "dist"]
venvPath = "."
venv = ".venv"
reportMissingImports = true
reportMissingTypeStubs = false
reportMissingModuleSource = false
reportUnusedImport = true
reportUnusedVariable = true
reportPrivateUsage = true

[[tool.pyright.executionEnvironments]]
root = "src"

[[tool.pyright.executionEnvironments]]
root = "tests"
reportMissingParameterType = false
reportUnknownParameterType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportInvalidTypeForm = false
reportPrivateUsage = false

# ─── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "C4"]
ignore = ["E501"]  # Line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["frame_compare"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ─── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "-q", "--strict-markers", "--strict-config"]
markers = [
    "unit: Fast isolated tests",
    "integration: Module interaction tests",
    "e2e: End-to-end CLI tests",
    "vs_required: Requires VapourSynth runtime",
    "slow: Long-running tests",
    "network: Requires network access",
    "tier_a: Contract/security tests (no VS, no network)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:vapoursynth",
]
anyio_mode = "auto"

# ─── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/frame_compare"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
fail_under = 80
show_missing = true

[tool.bandit]
exclude_dirs = [
    ".venv",
    ".uv_cache",
    ".desloppify",
    "tests"
]
