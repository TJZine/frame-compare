# Project executor presets are discovered from .codex/agents/*.toml.
# Feature selection and concurrency limits inherit host configuration.
[mcp_servers.codanna]
url = "http://127.0.0.1:8081/mcp"
http_headers = { Authorization = "Bearer mcp-access-token-dummy" }
enabled = true
required = false
default_tools_approval_mode = "approve"
