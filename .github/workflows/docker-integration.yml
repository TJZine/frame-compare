name: Docker Integration (VS + FFmpeg)

on:
  pull_request:
    branches: [main, pre-release, staging]
    paths:
      - src/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - Dockerfile
      - docker-compose*.yml
      - tools/verify_docker_*.sh
      - .github/workflows/docker-integration.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  docker-integration:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run canonical Docker verification
        run: bash tools/verify_docker_integration.sh --no-cache

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-e2e-artifacts
          path: generated/e2e
          if-no-files-found: warn
          retention-days: 14

      - name: Run opt-in alignment resource proof
        run: >-
          docker compose run --rm --no-deps
          -e FRAME_COMPARE_CONTINUOUS_ALIGNMENT_RESOURCES=1
          --entrypoint python
          frame-compare-test
          -m pytest
          -o cache_dir=/tmp/frame-compare-resource-pytest-cache
          tests/integration/test_alignment_streaming_resources.py -rsx -s
