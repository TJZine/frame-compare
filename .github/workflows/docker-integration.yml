name: Docker Integration (VS + FFmpeg)

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - docker-compose.yml
      - pyproject.toml
      - tools/verify_docker_integration.sh
      - src/frame_compare/render/**
      - src/frame_compare/vs/**
      - tests/integration/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-integration:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: frame-compare:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run integration tests (must be zero-skips)
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash frame-compare:ci -lc '
            python -m pytest -v -m "integration or vs_required" tests/integration/
          ' 2>&1 | tee docker_pytest.log

          if grep -Eq "([1-9][0-9]* skipped|skipped=[1-9][0-9]*)" docker_pytest.log; then
            echo "ERROR: Docker gate requires zero skipped tests."
            exit 1
          fi

          echo "OK: Docker integration tests passed with zero skips."
