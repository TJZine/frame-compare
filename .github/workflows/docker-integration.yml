name: Docker Integration (VS + FFmpeg)

on:
  pull_request:
    branches: [main, cleanup]
    paths:
      - Dockerfile
      - docker-compose.yml
      - pyproject.toml
      - tools/verify_docker_integration.sh
      - src/frame_compare/render/**
      - src/frame_compare/vs/**
      - tests/integration/**
      - tests/vs/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-integration:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Run canonical Docker verification
        run: bash tools/verify_docker_integration.sh
