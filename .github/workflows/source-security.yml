name: Exact revision source security

on:
  workflow_call:
    inputs:
      expected_sha:
        description: Full commit SHA to audit
        required: true
        type: string

permissions:
  contents: read

jobs:
  security:
    name: Bandit and active Python owners
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]]; then
            echo "Source security requires an exact commit checkout." >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
      - run: uv python install 3.13.18
      - run: uv sync --group dev --frozen
      - name: Check maintained Python owners
        run: bash tools/check_python_security.sh

  dependency-audit:
    name: Dependency Audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]]; then
            echo "Dependency audit requires an exact commit checkout." >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
      - run: uv python install 3.13.18
      - name: Install locked audit tool
        run: uv sync --group dev --frozen
      - name: Export locked dependency graph
        shell: bash
        run: >-
          uv export --frozen --all-groups --all-extras --no-emit-project
          --format requirements.txt --output-file "$RUNNER_TEMP/audit-requirements.txt"
      - name: Reject known dependency vulnerabilities
        shell: bash
        run: |
          uv run --no-sync pip-audit --strict --require-hashes --disable-pip \
            --progress-spinner off --timeout 20 --vulnerability-service pypi \
            --format json --output "$RUNNER_TEMP/pip-audit.json" \
            --requirement "$RUNNER_TEMP/audit-requirements.txt"
          uv run --no-sync python -I -B tools/validate_pip_audit.py \
            "$RUNNER_TEMP/pip-audit.json"
