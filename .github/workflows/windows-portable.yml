name: Windows portable

on:
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify artifacts or run the guarded release orchestrator
        required: true
        default: verify
        type: choice
        options:
          - verify
          - release
      channel:
        description: Publication channel (release operation only)
        required: true
        default: rc
        type: choice
        options:
          - rc
          - stable
      version:
        description: Exact repository version (release operation only)
        required: false
        type: string
      tag:
        description: Exact new tag (release operation only)
        required: false
        type: string
      expected_sha:
        description: Exact 40-character source commit SHA (verify or release operation)
        required: false
        type: string

permissions: {}

jobs:
  verify_pull_request:
    name: Verify unsigned Windows portable artifacts
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/windows-portable-build.yml
    with:
      expected_sha: ${{ github.sha }}
      release_tag: ""
      require_signing: false
      prepare_release_assets: false

  verify_manual:
    name: Verify signed Windows portable artifacts
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'verify'
    permissions:
      contents: read
    uses: ./.github/workflows/windows-portable-build.yml
    with:
      expected_sha: ${{ inputs.expected_sha || github.sha }}
      release_tag: ""
      require_signing: true
      prepare_release_assets: false
    secrets:
      WINDOWS_UPDATE_SIGNING_KEY_XML: ${{ secrets.WINDOWS_UPDATE_SIGNING_KEY_XML }}

  release:
    name: Run guarded release
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'release'
    permissions:
      attestations: write
      contents: write
      id-token: write
    concurrency:
      group: frame-compare-release-${{ inputs.tag }}
      cancel-in-progress: false
    uses: ./.github/workflows/release.yml
    with:
      channel: ${{ inputs.channel }}
      version: ${{ inputs.version }}
      tag: ${{ inputs.tag }}
      expected_sha: ${{ inputs.expected_sha }}
    secrets:
      WINDOWS_UPDATE_SIGNING_KEY_XML: ${{ secrets.WINDOWS_UPDATE_SIGNING_KEY_XML }}
