name: Prepare v0.2.0 version state

on:
  push:
    branches: [cleanup]
    paths:
      - ".github/workflows/prepare-v0.2.0-once.yml"

permissions:
  contents: write

concurrency:
  group: prepare-v0.2.0-version-state
  cancel-in-progress: false

jobs:
  prepare:
    name: Align v0.2.0 release authorities
    if: github.repository == 'TJZine/frame-compare'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: cleanup
          fetch-depth: 1
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Install Python 3.13.15
        shell: bash
        run: uv python install 3.13.15

      - name: Prepare v0.2.0 version state
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path


          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")


          replace_once(
              Path("pyproject.toml"),
              'version = "0.1.0"',
              'version = "0.2.0"',
          )
          replace_once(
              Path("src/frame_compare/__init__.py"),
              '__version__ = "0.1.0"',
              '__version__ = "0.2.0"',
          )

          manifest_path = Path(".release-please-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest != {".": "0.1.0"}:
              raise SystemExit(f"unexpected release manifest state: {manifest!r}")
          manifest_path.write_text(
              json.dumps({".": "0.2.0"}, indent=2) + "\n",
              encoding="utf-8",
          )

          lock_path = Path("uv.lock")
          lock_text = lock_path.read_text(encoding="utf-8")
          old_lock_block = '''[[package]]
          name = "frame-compare"
          version = "0.1.0"
          source = { editable = "." }
          '''
          new_lock_block = '''[[package]]
          name = "frame-compare"
          version = "0.2.0"
          source = { editable = "." }
          '''
          if lock_text.count(old_lock_block) != 1:
              raise SystemExit("uv.lock: root editable package block was not found exactly once")
          lock_path.write_text(
              lock_text.replace(old_lock_block, new_lock_block),
              encoding="utf-8",
          )

          Path("CHANGELOG.md").write_text(
              '''# Changelog

          All notable changes to Frame Compare will be documented in this file.

          ## Unreleased

          ## [0.2.0]

          ### Added

          - Add previous-offset reuse controls (`disabled`, `prompt`, and `always`) with shared-cache identity, provenance, stability validation, interactive acceptance, and structured CLI errors.
          - Add post-report slow.pics upload confirmation for interactive runs.
          - Add a consent-gated, run-only full-window retry when configured lead/trail exclusions leave too little eligible media; authored configuration remains unchanged.
          - Add report payload v1.2 with release-aware source identities, distinct comparison/source-frame domains, exact picture type and Dolby Vision RPU facts when observable, file-size context, rendering disclosures, and expanded Inspector, review, and viewport behavior.
          - Add code-owned media-runtime identities and scoped fingerprints for analysis, probing, alignment, source indexing, cache invalidation, Docker, Windows portable, and code-only update compatibility.
          - Add a guarded immutable release workflow with exact version, tag, and SHA validation; collision checks; draft and asset verification; remote digest checks; and artifact provenance attestations.
          - Bundle Inter Regular under the SIL Open Font License 1.1 for deterministic overlay typography.

          ### Changed

          - Bump Frame Compare to 0.2.0 and refresh the managed stack to Python 3.13.15, uv 0.12.5, VapourSynth R79/API R4.2, L-SMASH-Works 1296, vs-placebo 2.0.4, Akarin 1.4.1, and VSZip 22.1.0. Docker includes FFMS2 5.0; Windows portable intentionally excludes FFMS2.
          - Make random, dark, bright, and motion frame selection deterministic and temporally stratified while preserving seed reproducibility, minimum-gap behavior, sparse source coordinates, category counts, and selection diagnostics.
          - Classify alignment stability and strengthen shared reuse-cache identity and schema validation and previous-offset presentation.
          - Improve CLI help, wizard, side-effect-free dry-run planning, chronological human progress output on stderr, JSON output contracts, warnings, and success summaries.
          - Carry canonical exact-frame, signal, presentation, geometry, and tonemap facts through rendering, overlays, slow.pics upload planning, and reports.
          - Strengthen Frame Compare-owned L-SMASH index naming and media-runtime-aware cache invalidation.
          - Expand deterministic Docker and Windows portable runtime, packaging, installer, updater, rollback, provenance, license, and extracted-bundle verification.

          ### Fixed

          - Merge FFprobe HDR color metadata field-by-field only when VapourSynth frame properties are missing, malformed, or H.273-unspecified.
          - Capture FFmpeg picture type from the same exact-frame extraction process used to produce the screenshot.
          - Improve recoverable selection failures, source-frame range handling, and post-retry fatal error behavior.
          - Harden VSPreview startup compatibility checks and redact inherited credential values from surfaced startup diagnostics.

          ### Security

          - Require signed Windows code-only updates to match both dependency and media-runtime fingerprints before replacement, with file-hash verification, backups, and rollback.
          - Verify pinned source commits with complete tracked-tree SHA-256 digests and preserve native-library, plugin-manifest, license, and corresponding-source provenance.
          - Validate ZIP path safety, case collisions, required bundle contents, bounded process evidence, release asset checksums, remote digests, and publication state before release.

          ### Upgrade notes

          - Windows v0.1.0 portable installations require the complete v0.2.0 bundle because the managed media-runtime fingerprint changed; the code-only updater refuses incompatible runtimes.
          - Analysis, probe, alignment, and source-index caches include updated runtime identities and may be invalidated or rebuilt.
          - Existing v1.1 reports remain self-contained; regenerated v1.2 reports start with fresh browser-local viewer and review state.
          '''.replace("          ", ""),
              encoding="utf-8",
          )

          test_path = Path("tests/workflows/test_github_workflows.py")
          test_text = test_path.read_text(encoding="utf-8")
          start = test_text.index("def test_release_please_remains_guarded_and_non_merging")
          end = test_text.index("def test_windows_portable_dispatch_owns_immutable_release_inputs_and_secrets", start)
          replacement = '''def test_release_please_remains_guarded_and_non_merging(repo_root: Path) -> None:
              workflow = _load_workflow(repo_root / ".github" / "workflows" / "release-please.yml")
              guard = workflow["jobs"]["initial_release_guard"]
              release = workflow["jobs"]["release_please"]
              action = next(step for step in release["steps"] if "uses" in step)
              checkout = next(
                  step
                  for step in guard["steps"]
                  if str(step.get("uses", "")).startswith("actions/checkout@")
              )
              guard_step = next(step for step in guard["steps"] if step.get("id") == "guard")
              guard_run = str(guard_step["run"])

              assert workflow["permissions"] == {"contents": "read"}
              assert guard["permissions"] == {"contents": "read"}
              assert release["needs"] == "initial_release_guard"
              assert release["if"] == "needs.initial_release_guard.outputs.enabled == 'true'"
              assert release["permissions"] == {"contents": "write", "pull-requests": "write"}
              assert action["with"]["skip-github-release"] == "true"
              assert checkout["with"]["fetch-depth"] == 1
              assert checkout["with"]["persist-credentials"] == "false"
              assert ".release-please-manifest.json" in guard_run
              assert 'release_tag="v${manifest_version}"' in guard_run
              assert "releases/tags/${release_tag}" in guard_run
              assert "git/ref/tags/${release_tag}" in guard_run
              assert "v0.1.0" not in guard_run
              for step in _steps(workflow):
                  command = str(step.get("run", ""))
                  assert "gh pr merge" not in command, step.get("name")


          '''.replace("          ", "")
          test_path.write_text(
              test_text[:start] + replacement + test_text[end:],
              encoding="utf-8",
          )

          runbook_path = Path("docs/ENGINEERING_RUNBOOK.md")
          runbook_text = runbook_path.read_text(encoding="utf-8")
          old_runbook = '''- `.github/workflows/release-please.yml` stays dormant until a published stable
            `v0.1.0` exists, then resumes human-reviewed version/changelog PR behavior with
            GitHub-release creation disabled. The guarded entrypoint publishes later
            releases too.'''.replace("            ", "  ")
          new_runbook = '''- `.github/workflows/release-please.yml` runs only after the version currently
            recorded in `.release-please-manifest.json` has a matching published stable tag
            and release. This keeps it dormant while the guarded release entrypoint is
            publishing that manifest version, then resumes human-reviewed version/changelog
            PR behavior for later changes. GitHub-release creation remains disabled; the
            guarded entrypoint owns publication.'''.replace("            ", "  ")
          if runbook_text.count(old_runbook) != 1:
              raise SystemExit("engineering runbook Release Please policy was not found exactly once")
          runbook_path.write_text(
              runbook_text.replace(old_runbook, new_runbook),
              encoding="utf-8",
          )
          PY

          uv lock --check --offline
          python scripts/validate_release_contract.py \
            --channel stable \
            --version 0.2.0 \
            --tag v0.2.0 \
            --expected-sha "$EXPECTED_SHA" \
            --main-sha "$EXPECTED_SHA"
          git diff --check

      - name: Commit version transition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .release-please-manifest.json \
            CHANGELOG.md \
            docs/ENGINEERING_RUNBOOK.md \
            pyproject.toml \
            src/frame_compare/__init__.py \
            tests/workflows/test_github_workflows.py \
            uv.lock
          if git diff --cached --quiet; then
            echo "No v0.2.0 version-state changes were produced." >&2
            exit 1
          fi
          git commit -m "chore(release): prepare v0.2.0 version state"
          git push origin HEAD:cleanup
