name: Release Please

on:
  push:
    branches: [pre-release]

permissions:
  contents: read

concurrency:
  group: release-please-pre-release
  cancel-in-progress: false

jobs:
  stable_release_guard:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.guard.outputs.enabled }}
    steps:
      - name: Fetch live integration head and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/pre-release
          fetch-depth: 0
          persist-credentials: false

      - name: Require the published stable version in integration history
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B -m scripts.release_plan release-please-guard

  release_please:
    needs: stable_release_guard
    if: needs.stable_release_guard.outputs.enabled == 'true'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: pre-release
          skip-github-release: true
