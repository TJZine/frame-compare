name: Documentation

on:
  pull_request:
    branches: [main, pre-release, staging]
    paths: &docs-paths
      - docs/**
      - README.md
      - CONTRIBUTING.md
      - zensical.toml
      - pyproject.toml
      - uv.lock
      - .gitignore
      - .github/workflows/docs.yml
      - .github/ISSUE_TEMPLATE/config.yml
      - scripts/generate_api_docs.py
      - scripts/api_docs/**
      - tests/workflows/test_docs_workflow.py
  push:
    branches: [main, staging]
    paths: *docs-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    concurrency:
      group: docs-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.0"
          enable-cache: false

      - name: Install documentation dependencies
        run: uv sync --only-group docs --locked

      - name: Check generated API documentation
        run: uv run --no-sync python scripts/generate_api_docs.py --check

      - name: Build documentation
        run: uv run --no-sync zensical build --clean --strict

      - name: Check user documentation search scope
        run: |
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path

          items = json.loads(Path("site/search.json").read_text(encoding="utf-8"))["items"]
          internal = [
              item["location"]
              for item in items
              if item["location"].startswith(("TODO/", "plans/", "reviews/", "prompts/", "images/", "release-evidence/"))
          ]
          if internal:
              raise SystemExit(f"Internal documentation leaked into search: {internal}")
          PY

      - name: Configure GitHub Pages
        if: &deploy-from-main >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        if: *deploy-from-main
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    name: Deploy documentation
    if: *deploy-from-main
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
