name: Temporary dependency refresh

on:
  push:
    branches:
      - dev/v.0.20
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-refresh-dev-v0-2-0
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh and validate non-media dependencies
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[dependency-refresh-result]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.result.outputs.sha }}
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev/v.0.20
          fetch-depth: 0

      - name: Set up Python 3.13.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"

      - name: Set up uv 0.12.2
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          enable-cache: false

      - name: Configure dependency commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin dev/v.0.20
          test "$(git rev-parse origin/dev/v.0.20)" = "$GITHUB_SHA"

      - name: Refresh routine Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          replacements = {
              '"numpy>=2.4.6"': '"numpy>=2.5.1"',
              '"structlog>=25.5.0"': '"structlog>=26.1.0"',
              '"anyio>=4.12.0"': '"anyio>=4.14.2"',
              '"bandit[toml]>=1.8.0"': '"bandit[toml]>=1.9.4"',
              '"import-linter>=2.9"': '"import-linter>=2.13"',
              '"pytest>=9.0.2"': '"pytest>=9.1.1"',
              '"pyright>=1.1.407"': '"pyright>=1.1.411"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected dependency declaration not found: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          uv lock \
            --upgrade-package numpy \
            --upgrade-package structlog \
            --upgrade-package anyio \
            --upgrade-package bandit \
            --upgrade-package import-linter \
            --upgrade-package pytest \
            --upgrade-package pyright
          uv lock --check
          git add pyproject.toml uv.lock
          git commit -m "build(deps): refresh routine Python dependencies"

      - name: Upgrade Ruff in isolation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          old = '"ruff>=0.14.10"'
          new = '"ruff>=0.16.0"'
          if old not in text:
              raise SystemExit(f"Expected dependency declaration not found: {old}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          uv lock --upgrade-package ruff
          uv sync --group dev --frozen
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check src tests scripts tools
          git add pyproject.toml uv.lock
          git commit -m "build(deps): upgrade Ruff to 0.16"

      - name: Upgrade Typer in isolation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          old = '"typer>=0.21.0"'
          new = '"typer>=0.27.1"'
          if old not in text:
              raise SystemExit(f"Expected dependency declaration not found: {old}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          uv lock --upgrade-package typer
          uv sync --group dev --frozen
          uv run --no-sync pytest -q tests/cli tests/e2e/test_cli_version.py
          git add pyproject.toml uv.lock
          git commit -m "build(deps): upgrade Typer CLI runtime"

      - name: Upgrade GuessIt in isolation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          old = '"guessit>=3.8.0"'
          new = '"guessit>=4.1.0"'
          if old not in text:
              raise SystemExit(f"Expected dependency declaration not found: {old}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          uv lock --upgrade-package guessit
          uv sync --group dev --frozen
          uv run --no-sync pytest -q tests/services/test_metadata_parsing.py
          git add pyproject.toml uv.lock
          git commit -m "build(deps): upgrade GuessIt metadata parser"

      - name: Verify exact direct dependency results
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import tomllib

          lock = tomllib.loads(Path("uv.lock").read_text(encoding="utf-8"))
          versions = {package["name"]: package["version"] for package in lock["package"] if "version" in package}
          expected = {
              "numpy": "2.5.1",
              "structlog": "26.1.0",
              "anyio": "4.14.2",
              "bandit": "1.9.4",
              "import-linter": "2.13",
              "pytest": "9.1.1",
              "pyright": "1.1.411",
              "ruff": "0.16.0",
              "typer": "0.27.1",
              "guessit": "4.1.0",
          }
          mismatches = {
              name: (versions.get(name), wanted)
              for name, wanted in expected.items()
              if versions.get(name) != wanted
          }
          if mismatches:
              raise SystemExit(f"Unexpected locked versions: {mismatches}")
          PY

      - name: Run full source validation
        shell: bash
        run: |
          set -euo pipefail
          uv sync --group dev --group docs --frozen
          uv lock --check
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check src tests scripts tools
          uv run --no-sync pyright --warnings
          uv run --no-sync bandit -c pyproject.toml -r src --severity-level medium
          uv run --no-sync lint-imports --config importlinter.ini
          uv run --no-sync pytest -q
          uv run --no-sync python scripts/generate_api_docs.py --check
          uv run --no-sync zensical build --clean --strict
          uv build --out-dir dist
          uv export --frozen --no-dev --all-extras --no-emit-project \
            --format requirements.txt \
            --output-file "$RUNNER_TEMP/audit-requirements.txt"
          uv run --no-sync pip-audit --strict --require-hashes --disable-pip \
            --progress-spinner off --timeout 20 --vulnerability-service pypi \
            --requirement "$RUNNER_TEMP/audit-requirements.txt"

      - name: Refresh Python and uv toolchain pins
        shell: bash
        run: |
          set -euo pipefail
          uv_digest="$(docker buildx imagetools inspect ghcr.io/astral-sh/uv:0.12.2 | awk '/^Digest:/ {print $2; exit}')"
          python_digest="$(docker buildx imagetools inspect python:3.13.14-slim-trixie | awk '/^Digest:/ {print $2; exit}')"
          [[ "$uv_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$python_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          python_zip="$RUNNER_TEMP/python-3.13.14-embed-amd64.zip"
          curl --fail --silent --show-error --location \
            "https://www.python.org/ftp/python/3.13.14/python-3.13.14-embed-amd64.zip" \
            --output "$python_zip"
          python_zip_sha="$(sha256sum "$python_zip" | awk '{print $1}')"
          python_zip_bytes="$(stat --format='%s' "$python_zip")"
          [[ "$python_zip_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$python_zip_bytes" =~ ^[1-9][0-9]*$ ]]

          UV_IMAGE_DIGEST="$uv_digest" \
          PYTHON_IMAGE_DIGEST="$python_digest" \
          PYTHON_ZIP_SHA="$python_zip_sha" \
          PYTHON_ZIP_BYTES="$python_zip_bytes" \
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          def replace_exact(path: Path, old: str, new: str, count: int | None = None) -> None:
              text = path.read_text(encoding="utf-8")
              actual = text.count(old)
              expected = 1 if count is None else count
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s) of {old!r}, found {actual}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          dockerfile = Path("Dockerfile")
          text = dockerfile.read_text(encoding="utf-8")
          text, uv_count = re.subn(
              r"ghcr\.io/astral-sh/uv:0\.11\.31@sha256:[0-9a-f]{64}",
              f"ghcr.io/astral-sh/uv:0.12.2@{os.environ['UV_IMAGE_DIGEST']}",
              text,
          )
          text, python_count = re.subn(
              r"python:3\.13\.13-slim-trixie@sha256:[0-9a-f]{64}",
              f"python:3.13.14-slim-trixie@{os.environ['PYTHON_IMAGE_DIGEST']}",
              text,
          )
          if uv_count != 1 or python_count != 2:
              raise SystemExit(f"Unexpected Docker pin counts: uv={uv_count}, python={python_count}")
          dockerfile.write_text(text, encoding="utf-8")

          for workflow in (
              Path(".github/workflows/ci.yml"),
              Path(".github/workflows/docs.yml"),
              Path(".github/workflows/windows-portable-build.yml"),
          ):
              text = workflow.read_text(encoding="utf-8")
              if 'version: "0.11.31"' not in text:
                  raise SystemExit(f"{workflow}: missing uv 0.11.31 pin")
              workflow.write_text(text.replace('version: "0.11.31"', 'version: "0.12.2"'), encoding="utf-8")

          windows_workflow = Path(".github/workflows/windows-portable-build.yml")
          text = windows_workflow.read_text(encoding="utf-8")
          if text.count("3.13.13") != 2:
              raise SystemExit("Unexpected Python version occurrence count in Windows workflow")
          windows_workflow.write_text(text.replace("3.13.13", "3.13.14"), encoding="utf-8")

          replace_exact(
              Path("tests/workflows/test_docs_workflow.py"),
              'version: "0.11.31"',
              'version: "0.12.2"',
          )
          replace_exact(
              Path("docs/getting-started/index.md"),
              "Python 3.13.13",
              "Python 3.13.14",
          )

          manifest_path = Path("tools/windows_portable/manifest.windows-x64.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["bundle"]["python_version"] = "3.13.14"
          python_artifact = next(
              artifact for artifact in manifest["artifacts"] if artifact["id"] == "python-embed-amd64"
          )
          python_artifact.update(
              {
                  "version": "3.13.14",
                  "url": "https://www.python.org/ftp/python/3.13.14/python-3.13.14-embed-amd64.zip",
                  "source_url": "https://www.python.org/ftp/python/3.13.14/Python-3.13.14.tgz",
                  "sha256": os.environ["PYTHON_ZIP_SHA"],
                  "bytes": int(os.environ["PYTHON_ZIP_BYTES"]),
              }
          )
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

          if rg -n '0\.11\.31|3\.13\.13' \
              Dockerfile \
              .github/workflows/ci.yml \
              .github/workflows/docs.yml \
              .github/workflows/windows-portable-build.yml \
              tests/workflows/test_docs_workflow.py \
              docs/getting-started/index.md \
              tools/windows_portable/manifest.windows-x64.json; then
            echo "Stale toolchain version references remain in active files." >&2
            exit 1
          fi

          uv lock --check
          uv run --no-sync pytest -q \
            tests/workflows/test_docs_workflow.py \
            tests/workflows/test_github_workflows.py \
            tests/windows_portable/test_windows_portable_build_scripts.py \
            tests/windows_portable/test_windows_portable_docs.py
          git add \
            Dockerfile \
            .github/workflows/ci.yml \
            .github/workflows/docs.yml \
            .github/workflows/windows-portable-build.yml \
            tests/workflows/test_docs_workflow.py \
            docs/getting-started/index.md \
            tools/windows_portable/manifest.windows-x64.json
          git commit -m "build(deps): update Python and uv toolchain pins"

      - name: Verify media runtime pins are unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff "$GITHUB_SHA"..HEAD -- Dockerfile tools/windows_portable/manifest.windows-x64.json > "$RUNNER_TEMP/toolchain.diff"
          grep -q 'VAPOURSYNTH_VERSION=76' Dockerfile
          grep -q 'ARG VS_PLACEBO_VERSION=2.0.2' Dockerfile
          grep -q 'ARG LSMASH_REF=v2.14.5' Dockerfile
          grep -q '"vs_ref": "R76"' tools/windows_portable/manifest.windows-x64.json
          grep -q '"version": "1282.0.0.0"' tools/windows_portable/manifest.windows-x64.json
          grep -q '"version": "2.0.2"' tools/windows_portable/manifest.windows-x64.json

      - name: Push validated commits to the confirmed branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev/v.0.20
          remote_sha="$(git rev-parse origin/dev/v.0.20)"
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "Branch advanced during dependency refresh; refusing to overwrite $remote_sha." >&2
            exit 1
          fi
          git push origin HEAD:refs/heads/dev/v.0.20

      - name: Publish result SHA
        id: result
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  docker-validation:
    name: Validate Docker media environment after non-media refresh
    needs: refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out validated result
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.refresh.outputs.sha }}
          persist-credentials: false
      - name: Run canonical Docker verification
        run: bash tools/verify_docker_integration.sh

  windows-validation:
    name: Validate Windows portable bundle after non-media refresh
    needs: refresh
    permissions:
      contents: read
    uses: ./.github/workflows/windows-portable-build.yml
    with:
      expected_sha: ${{ needs.refresh.outputs.sha }}
      release_tag: ""
      require_signing: false
      prepare_release_assets: false
