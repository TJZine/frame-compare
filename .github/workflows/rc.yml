name: Release candidate

on:
  push:
    branches: [pre-release]

permissions: {}

concurrency:
  group: release-rc
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      status: ${{ steps.plan.outputs.status }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      channel: ${{ steps.plan.outputs.channel }}
    steps:
      - name: Fetch live branch heads and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/pre-release
          fetch-depth: 0
          persist-credentials: false

      - name: Plan rc release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B -m scripts.release_plan plan-rc

  source-security:
    needs: plan
    if: needs.plan.outputs.status == 'publish'
    permissions:
      contents: read
    uses: ./.github/workflows/source-security.yml
    with:
      expected_sha: ${{ needs.plan.outputs.sha }}

  windows:
    needs: [plan, source-security]
    if: needs.plan.outputs.status == 'publish'
    permissions:
      contents: read
    uses: ./.github/workflows/windows-portable.yml
    with:
      sha: ${{ needs.plan.outputs.sha }}
      release_build: true

  publish:
    needs: [plan, source-security, windows]
    if: needs.plan.outputs.status == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Require the exact build artifact
        shell: bash
        env:
          BUNDLE_ID: ${{ needs.windows.outputs.bundle_id }}
          BUNDLE_DIGEST: ${{ needs.windows.outputs.bundle_digest }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$BUNDLE_ID" =~ ^[1-9][0-9]*$ && "$BUNDLE_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]

      - name: Download the scanned ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.windows.outputs.bundle_id }}
          path: ${{ runner.temp }}/release-assets
          skip-decompress: true
          digest-mismatch: error

      - name: Upload and verify the draft before publishing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          BUNDLE_DIGEST: ${{ needs.windows.outputs.bundle_digest }}
        run: |
          set -euo pipefail
          python3 -B -m scripts.release_plan publish \
            --sha "$RELEASE_SHA" --tag "$RELEASE_TAG" \
            --archive "$RUNNER_TEMP/release-assets/frame-compare-portable-win-x64.zip" \
            --digest "$BUNDLE_DIGEST"
