name: Guarded release

on:
  workflow_call:
    inputs:
      channel:
        description: Publication channel
        required: true
        type: string
      version:
        description: Exact repository version (for example 0.1.0rc1 or 0.1.0)
        required: true
        type: string
      tag:
        description: Exact new tag (for example v0.1.0-rc.1 or v0.1.0)
        required: true
        type: string
      expected_sha:
        description: Exact 40-character source commit SHA
        required: true
        type: string
    secrets:
      WINDOWS_UPDATE_SIGNING_KEY_XML:
        required: true

permissions: {}

jobs:
  preflight:
    name: Validate immutable release request
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      main_sha: ${{ steps.main.outputs.sha }}
    steps:
      - name: Checkout exact expected commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve current main head
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ ! "$main_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Current main head did not resolve to an exact commit SHA." >&2
            exit 1
          fi
          printf 'sha=%s\n' "$main_sha" >> "$GITHUB_OUTPUT"

      - name: Validate release channel, versions, tag, and SHA
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          MAIN_SHA: ${{ steps.main.outputs.sha }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DISPATCH_SHA" != "$EXPECTED_SHA" ]]; then
            echo "The selected workflow ref head must equal expected_sha." >&2
            exit 1
          fi
          if [[ "$RELEASE_CHANNEL" == "stable" && "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "Stable publication must be dispatched from the main branch." >&2
            exit 1
          fi
          python scripts/validate_release_contract.py \
            --channel "$RELEASE_CHANNEL" \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --expected-sha "$EXPECTED_SHA" \
            --main-sha "$MAIN_SHA"

      - name: Enforce initial stable release identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_CHANNEL" != "stable" ]]; then
            exit 0
          fi
          set +e
          initial_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v0.1.0" 2>&1)"
          status=$?
          set -e
          initial_published="false"
          if [[ "$status" -eq 0 ]]; then
            draft="$(jq -r '.draft' <<<"$initial_json")"
            prerelease="$(jq -r '.prerelease' <<<"$initial_json")"
            tag_name="$(jq -r '.tag_name' <<<"$initial_json")"
            if [[ "$draft" == "false" && "$prerelease" == "false" && "$tag_name" == "v0.1.0" ]]; then
              initial_published="true"
            fi
          elif [[ "$initial_json" != *"HTTP 404"* ]]; then
            echo "Unable to determine whether the initial stable release exists." >&2
            exit 1
          fi
          if [[
            "$initial_published" != "true" &&
            ( "$RELEASE_VERSION" != "0.1.0" || "$RELEASE_TAG" != "v0.1.0" )
          ]]; then
            echo "The first published stable release must be exactly version 0.1.0 and tag v0.1.0." >&2
            exit 1
          fi

      - name: Reject existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          check_absent() {
            local endpoint="$1"
            local label="$2"
            local response
            local status
            set +e
            response="$(gh api "$endpoint" 2>&1)"
            status=$?
            set -e
            if [[ "$status" -eq 0 ]]; then
              echo "$label already exists; refusing to continue." >&2
              exit 1
            fi
            if [[ "$response" != *"HTTP 404"* ]]; then
              echo "Unable to prove that $label is absent." >&2
              exit 1
            fi
          }
          check_absent "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" "tag ${RELEASE_TAG}"
          check_absent "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" "release ${RELEASE_TAG}"

  windows:
    name: Build, sign, and verify Windows assets
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/windows-portable-build.yml
    with:
      expected_sha: ${{ inputs.expected_sha }}
      release_tag: ${{ inputs.tag }}
      require_signing: true
      prepare_release_assets: true
    secrets:
      WINDOWS_UPDATE_SIGNING_KEY_XML: ${{ secrets.WINDOWS_UPDATE_SIGNING_KEY_XML }}

  publish:
    name: Draft, verify, and publish
    needs: [preflight, windows]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ inputs.channel == 'stable' && 'production' || 'release-candidate' }}
    steps:
      - name: Download exact release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frame-compare-release-assets
          path: dist/release-assets

      - name: Verify complete local asset set
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "frame-compare-portable-win-x64-${RELEASE_TAG}.zip"
            "frame-compare-portable-win-x64-${RELEASE_TAG}.zip.sha256"
            "frame-compare-update-win-x64-${RELEASE_TAG}.zip"
            "frame-compare-update-win-x64-${RELEASE_TAG}.zip.sha256"
          )
          mapfile -t actual < <(find dist/release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${actual[*]}" != "${wanted[*]}" ]]; then
            echo "Release asset directory does not contain the exact mandatory set." >&2
            printf 'expected: %s\n' "${wanted[*]}" >&2
            printf 'actual: %s\n' "${actual[*]}" >&2
            exit 1
          fi
          (
            cd dist/release-assets
            sha256sum --check "frame-compare-portable-win-x64-${RELEASE_TAG}.zip.sha256"
            sha256sum --check "frame-compare-update-win-x64-${RELEASE_TAG}.zip.sha256"
          )
          python - "$RELEASE_TAG" <<'PY'
          from pathlib import Path
          import sys
          from zipfile import ZipFile

          tag = sys.argv[1]
          update_zip = Path("dist/release-assets") / f"frame-compare-update-win-x64-{tag}.zip"
          with ZipFile(update_zip) as archive:
              entries = set(archive.namelist())
          required = {"update-manifest.json", "update-manifest.sig"}
          if not required.issubset(entries):
              raise SystemExit(f"Signed update is missing: {sorted(required - entries)}")
          if not any(name.startswith("payload/app/src/frame_compare/") for name in entries):
              raise SystemExit("Signed update has no Frame Compare code payload.")
          PY

      - name: Recheck main, collisions, and create exact tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          check_absent() {
            local endpoint="$1"
            local label="$2"
            local response
            local status
            set +e
            response="$(gh api "$endpoint" 2>&1)"
            status=$?
            set -e
            if [[ "$status" -eq 0 ]]; then
              echo "$label appeared after preflight; refusing to continue." >&2
              exit 1
            fi
            if [[ "$response" != *"HTTP 404"* ]]; then
              echo "Unable to prove that $label remains absent." >&2
              exit 1
            fi
          }
          if [[ "$RELEASE_CHANNEL" == "stable" ]]; then
            current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            if [[ "$current_main" != "$EXPECTED_SHA" ]]; then
              echo "Main advanced after preflight; refusing stable publication." >&2
              exit 1
            fi
          fi
          check_absent "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" "tag ${RELEASE_TAG}"
          check_absent "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" "release ${RELEASE_TAG}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${RELEASE_TAG}" \
            -f "sha=${EXPECTED_SHA}" >/dev/null
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          if [[ "$tag_sha" != "$EXPECTED_SHA" ]]; then
            echo "Created tag does not point to the approved commit." >&2
            exit 1
          fi

      - name: Create a new draft release
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease="false"
          if [[ "$RELEASE_CHANNEL" == "rc" ]]; then
            prerelease="true"
          fi
          release_json="$(
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f "tag_name=${RELEASE_TAG}" \
              -f "target_commitish=${EXPECTED_SHA}" \
              -f "name=Frame Compare ${RELEASE_TAG}" \
              -f "body=Frame Compare ${RELEASE_TAG}. See CHANGELOG.md at the tagged commit." \
              -F "draft=true" \
              -F "prerelease=${prerelease}"
          )"
          release_id="$(jq -r '.id' <<<"$release_json")"
          if [[ ! "$release_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "GitHub did not return a new draft release ID." >&2
            exit 1
          fi
          upload_url="$(jq -r '.upload_url' <<<"$release_json")"
          upload_url="${upload_url%%\{*}"
          expected_upload_url="https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets"
          if [[ "$upload_url" != "$expected_upload_url" ]]; then
            echo "GitHub returned an unexpected release asset upload URL." >&2
            exit 1
          fi
          printf 'release_id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"
          printf 'upload_url=%s\n' "$upload_url" >> "$GITHUB_OUTPUT"

      - name: Attach every mandatory asset to the new draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create_release.outputs.release_id }}
          UPLOAD_URL: ${{ steps.create_release.outputs.upload_url }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/release-assets/*)
          if [[ "${#assets[@]}" -ne 4 ]]; then
            echo "Expected exactly four verified local assets before upload." >&2
            exit 1
          fi
          for asset in "${assets[@]}"; do
            name="$(basename "$asset")"
            encoded_name="$(jq -rn --arg value "$name" '$value | @uri')"
            response_file="$(mktemp)"
            http_status="$(
              curl --silent --show-error \
                --connect-timeout 15 \
                --max-time 300 \
                --output "$response_file" \
                --write-out '%{http_code}' \
                --request POST \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --header "Content-Type: application/octet-stream" \
                --data-binary "@${asset}" \
                "${UPLOAD_URL}?name=${encoded_name}"
            )"
            if [[ "$http_status" != "201" ]]; then
              rm -f "$response_file"
              echo "GitHub did not create release asset: $name (HTTP $http_status)." >&2
              exit 1
            fi
            uploaded_id="$(jq -r '.id' "$response_file")"
            rm -f "$response_file"
            if [[ ! "$uploaded_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "GitHub did not return a created asset ID for: $name" >&2
              exit 1
            fi
          done

      - name: Verify draft target and exact remote asset bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_ID: ${{ steps.create_release.outputs.release_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          release_endpoint="repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          draft="$(gh api "$release_endpoint" --jq '.draft')"
          prerelease="$(gh api "$release_endpoint" --jq '.prerelease')"
          target="$(gh api "$release_endpoint" --jq '.target_commitish')"
          remote_tag="$(gh api "$release_endpoint" --jq '.tag_name')"
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          expected_prerelease="false"
          if [[ "$RELEASE_CHANNEL" == "rc" ]]; then
            expected_prerelease="true"
          fi
          if [[ "$draft" != "true" || "$prerelease" != "$expected_prerelease" ]]; then
            echo "Release is not the expected draft/channel state." >&2
            exit 1
          fi
          if [[ "$remote_tag" != "$RELEASE_TAG" || "$target" != "$EXPECTED_SHA" || "$tag_sha" != "$EXPECTED_SHA" ]]; then
            echo "Draft release or tag does not target the approved commit." >&2
            exit 1
          fi
          expected=(
            "frame-compare-portable-win-x64-${RELEASE_TAG}.zip"
            "frame-compare-portable-win-x64-${RELEASE_TAG}.zip.sha256"
            "frame-compare-update-win-x64-${RELEASE_TAG}.zip"
            "frame-compare-update-win-x64-${RELEASE_TAG}.zip.sha256"
          )
          mapfile -t actual < <(
            gh api "$release_endpoint" --jq '.assets[].name' | sort
          )
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${actual[*]}" != "${wanted[*]}" ]]; then
            echo "Draft release does not contain the exact non-empty mandatory asset set." >&2
            exit 1
          fi
          while IFS=$'\t' read -r name size digest; do
            if [[ ! "$size" =~ ^[1-9][0-9]*$ ]]; then
              echo "Remote asset is empty: $name" >&2
              exit 1
            fi
            local_hash="$(sha256sum "dist/release-assets/${name}" | cut -d' ' -f1)"
            if [[ "$digest" != "sha256:${local_hash}" ]]; then
              echo "Remote asset digest mismatch or unavailable: $name" >&2
              exit 1
            fi
          done < <(
            gh api "$release_endpoint" \
              --jq '.assets[] | [.name, (.size | tostring), (.digest // "")] | @tsv'
          )

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_ID: ${{ steps.create_release.outputs.release_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          release_endpoint="repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          prerelease="false"
          if [[ "$RELEASE_CHANNEL" == "rc" ]]; then
            prerelease="true"
          fi
          if [[ "$RELEASE_CHANNEL" == "stable" ]]; then
            current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            if [[ "$current_main" != "$EXPECTED_SHA" ]]; then
              echo "Main advanced before publication; refusing stable publication." >&2
              exit 1
            fi
          fi
          release_json="$(gh api "$release_endpoint")"
          draft="$(jq -r '.draft' <<<"$release_json")"
          remote_prerelease="$(jq -r '.prerelease' <<<"$release_json")"
          target="$(jq -r '.target_commitish' <<<"$release_json")"
          remote_tag="$(jq -r '.tag_name' <<<"$release_json")"
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          if [[
            "$draft" != "true" ||
            "$remote_prerelease" != "$prerelease" ||
            "$target" != "$EXPECTED_SHA" ||
            "$remote_tag" != "$RELEASE_TAG" ||
            "$tag_sha" != "$EXPECTED_SHA"
          ]]; then
            echo "Release, tag, or draft target changed before publication." >&2
            exit 1
          fi
          expected=(
            "frame-compare-portable-win-x64-${RELEASE_TAG}.zip"
            "frame-compare-portable-win-x64-${RELEASE_TAG}.zip.sha256"
            "frame-compare-update-win-x64-${RELEASE_TAG}.zip"
            "frame-compare-update-win-x64-${RELEASE_TAG}.zip.sha256"
          )
          mapfile -t actual < <(jq -r '.assets[].name' <<<"$release_json" | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${actual[*]}" != "${wanted[*]}" ]]; then
            echo "Remote asset set changed before publication." >&2
            exit 1
          fi
          while IFS=$'\t' read -r name size digest; do
            if [[ ! "$size" =~ ^[1-9][0-9]*$ ]]; then
              echo "Remote asset is empty before publication: $name" >&2
              exit 1
            fi
            local_hash="$(sha256sum "dist/release-assets/${name}" | cut -d' ' -f1)"
            if [[ "$digest" != "sha256:${local_hash}" ]]; then
              echo "Remote asset changed before publication: $name" >&2
              exit 1
            fi
          done < <(
            jq -r '.assets[] | [.name, (.size | tostring), (.digest // "")] | @tsv' \
              <<<"$release_json"
          )
          gh api --method PATCH "$release_endpoint" \
            -F "draft=false" \
            -F "prerelease=${prerelease}" >/dev/null

      - name: Verify final publication state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_ID: ${{ steps.create_release.outputs.release_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          release_endpoint="repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          release_json="$(gh api "$release_endpoint")"
          draft="$(jq -r '.draft' <<<"$release_json")"
          prerelease="$(jq -r '.prerelease' <<<"$release_json")"
          target="$(jq -r '.target_commitish' <<<"$release_json")"
          remote_tag="$(jq -r '.tag_name' <<<"$release_json")"
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          expected_prerelease="false"
          if [[ "$RELEASE_CHANNEL" == "rc" ]]; then
            expected_prerelease="true"
          fi
          if [[ "$RELEASE_CHANNEL" == "stable" ]]; then
            current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            if [[ "$current_main" != "$EXPECTED_SHA" ]]; then
              echo "Main no longer points to the published stable commit." >&2
              exit 1
            fi
          fi
          if [[
            "$draft" != "false" ||
            "$prerelease" != "$expected_prerelease" ||
            "$remote_tag" != "$RELEASE_TAG" ||
            "$target" != "$EXPECTED_SHA" ||
            "$tag_sha" != "$EXPECTED_SHA"
          ]]; then
            echo "Release did not reach the expected final publication state." >&2
            exit 1
          fi
          expected=(
            "frame-compare-portable-win-x64-${RELEASE_TAG}.zip"
            "frame-compare-portable-win-x64-${RELEASE_TAG}.zip.sha256"
            "frame-compare-update-win-x64-${RELEASE_TAG}.zip"
            "frame-compare-update-win-x64-${RELEASE_TAG}.zip.sha256"
          )
          mapfile -t actual < <(jq -r '.assets[].name' <<<"$release_json" | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${actual[*]}" != "${wanted[*]}" ]]; then
            echo "Published release does not contain the exact mandatory asset set." >&2
            exit 1
          fi
          while IFS=$'\t' read -r name size digest; do
            if [[ ! "$size" =~ ^[1-9][0-9]*$ ]]; then
              echo "Published release asset is empty: $name" >&2
              exit 1
            fi
            local_hash="$(sha256sum "dist/release-assets/${name}" | cut -d' ' -f1)"
            if [[ "$digest" != "sha256:${local_hash}" ]]; then
              echo "Published release asset digest mismatch: $name" >&2
              exit 1
            fi
          done < <(
            jq -r '.assets[] | [.name, (.size | tostring), (.digest // "")] | @tsv' \
              <<<"$release_json"
          )
