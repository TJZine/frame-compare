name: Reusable signed Windows portable build

on:
  workflow_call:
    inputs:
      expected_sha:
        description: Exact commit to build
        required: true
        type: string
      release_tag:
        description: Validated versioned asset tag
        required: false
        default: ""
        type: string
      require_signing:
        description: Require the protected signing path
        required: true
        type: boolean
      environment_name:
        description: GitHub environment that owns approval and signing-secret access
        required: true
        type: string
      prepare_release_assets:
        description: Prepare the exact four versioned release assets
        required: true
        type: boolean
    outputs:
      release_assets_id:
        description: Immutable artifact ID of the four verified release assets
        value: ${{ jobs.package_attest.outputs.release_assets_id }}
    secrets:
      WINDOWS_UPDATE_SIGNING_KEY_XML:
        description: Named binding for the protected environment secret. Provision the key only in protected environments.
        required: true

permissions: {}

jobs:
  build_test:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      bundle_id: ${{ steps.build.outputs.bundle_id }}
      bundle_digest: ${{ steps.build.outputs.bundle_digest }}
      update_id: ${{ steps.build.outputs.update_id }}
      update_digest: ${{ steps.build.outputs.update_digest }}
    steps:
      - name: Validate signed workflow inputs
        shell: pwsh
        env:
          REQUIRE_SIGNING: ${{ inputs.require_signing }}
          ENVIRONMENT_NAME: ${{ inputs.environment_name }}
          PREPARE_RELEASE_ASSETS: ${{ inputs.prepare_release_assets }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:REQUIRE_SIGNING -cne "true" -or $env:ENVIRONMENT_NAME -cnotin @("production", "release-candidate")) {
            throw "Signed portable builds require a protected release environment."
          }
          if (($env:PREPARE_RELEASE_ASSETS -ceq "true") -ne ![string]::IsNullOrEmpty($env:RELEASE_TAG)) {
            throw "Release assets require a release tag; manual verification requires an empty tag."
          }

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:EXPECTED_SHA -cnotmatch '\A[0-9a-f]{40}\z' -or (git rev-parse HEAD).Trim() -cne $env:EXPECTED_SHA) {
            throw "Checkout did not resolve to the exact expected commit."
          }

      - name: Build and exercise Windows portable inputs
        id: build
        uses: ./.github/actions/windows-portable-build
        with:
          expected_sha: ${{ inputs.expected_sha }}
          require_signing: ${{ inputs.require_signing }}

  verify_unsigned:
    needs: build_test
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      receipt_id: ${{ steps.verify.outputs.receipt_id }}
      receipt_digest: ${{ steps.verify.outputs.receipt_digest }}
      verified_bundle_id: ${{ steps.verify.outputs.verified_bundle_id }}
      verified_update_id: ${{ steps.verify.outputs.verified_update_id }}
      manifest_id: ${{ steps.verify.outputs.manifest_id }}
      manifest_digest: ${{ steps.verify.outputs.manifest_digest }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:EXPECTED_SHA -cnotmatch '\A[0-9a-f]{40}\z' -or (git rev-parse HEAD).Trim() -cne $env:EXPECTED_SHA) {
            throw "Checkout did not resolve to the exact expected commit."
          }

      - name: Verify unsigned inputs on a fresh runner
        id: verify
        uses: ./.github/actions/windows-portable-verify
        with:
          expected_sha: ${{ inputs.expected_sha }}
          release_tag: ${{ inputs.release_tag }}
          require_portable_authority: "true"
          bundle_id: ${{ needs.build_test.outputs.bundle_id }}
          bundle_digest: ${{ needs.build_test.outputs.bundle_digest }}
          update_id: ${{ needs.build_test.outputs.update_id }}
          update_digest: ${{ needs.build_test.outputs.update_digest }}

  artifact_security:
    name: Inventory and scan verified portable artifact
    needs: verify_unsigned
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      evidence_id: ${{ steps.evidence.outputs.artifact-id }}
      evidence_digest: ${{ steps.evidence.outputs.artifact-digest }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]]; then
            echo "Artifact security checkout did not resolve to the exact expected commit." >&2
            exit 1
          fi

      - name: Setup isolated host Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.18"

      - name: Require immutable verified inputs
        shell: bash
        env:
          VERIFIED_BUNDLE_ID: ${{ needs.verify_unsigned.outputs.verified_bundle_id }}
          RECEIPT_ID: ${{ needs.verify_unsigned.outputs.receipt_id }}
        run: |
          set -euo pipefail
          if [[ ! "$VERIFIED_BUNDLE_ID" =~ ^[1-9][0-9]*$ ]] || [[ ! "$RECEIPT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Artifact security requires exact portable and receipt artifact IDs." >&2
            exit 1
          fi

      - name: Download exact verified portable ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify_unsigned.outputs.verified_bundle_id }}
          path: ${{ runner.temp }}/portable-security-inputs
          skip-decompress: true
          digest-mismatch: error

      - name: Download exact verification receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify_unsigned.outputs.receipt_id }}
          path: ${{ runner.temp }}/portable-security-inputs
          skip-decompress: true
          digest-mismatch: error

      - name: Safely stage the receipt-bound portable tree
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VERIFIED_BUNDLE_ID: ${{ needs.verify_unsigned.outputs.verified_bundle_id }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/portable-security-evidence"
          mkdir "$evidence"
          python -B -I -S tools/windows_portable/artifact_security.py stage \
            --archive "$RUNNER_TEMP/portable-security-inputs/verified-portable.zip" \
            --verification "$RUNNER_TEMP/portable-security-inputs/verification.json" \
            --expected-sha "$EXPECTED_SHA" \
            --expected-artifact-id "$VERIFIED_BUNDLE_ID" \
            --output "$RUNNER_TEMP/portable-security-tree" \
            --scan-input "$evidence/scan-input.json"

      - name: Install checksum-pinned scanners
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/portable-security-tools"
          mkdir "$tools"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$tools/syft.tar.gz" \
            https://github.com/anchore/syft/releases/download/v1.57.1/syft_1.57.1_linux_amd64.tar.gz
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$tools/grype.tar.gz" \
            https://github.com/anchore/grype/releases/download/v0.121.3/grype_0.121.3_linux_amd64.tar.gz
          (
            cd "$tools"
            echo "bf52519eb57f675d47c07d43213cb6dff6449f3d6d1147ff6701ed91f44eef0c  syft.tar.gz" | sha256sum --check
            echo "e9da18cc1429e786722e32161288103600efffd8e483c90761f90485bd1bec85  grype.tar.gz" | sha256sum --check
            tar --extract --gzip --file syft.tar.gz --no-same-owner syft
            tar --extract --gzip --file grype.tar.gz --no-same-owner grype
          )
          printf 'SYFT_BIN=%s\n' "$tools/syft" >> "$GITHUB_ENV"
          printf 'GRYPE_BIN=%s\n' "$tools/grype" >> "$GITHUB_ENV"

      - name: Generate SBOMs and unsuppressed advisory evidence
        shell: bash
        env:
          GRYPE_DB_AUTO_UPDATE: "true"
          GRYPE_DB_CACHE_DIR: ${{ runner.temp }}/grype-db
          GRYPE_DB_MAX_ALLOWED_BUILT_AGE: 120h
          GRYPE_DB_MAX_UPDATE_CHECK_FREQUENCY: "0"
          GRYPE_DB_REQUIRE_UPDATE_CHECK: "true"
          GRYPE_DB_VALIDATE_AGE: "true"
          GRYPE_DB_VALIDATE_BY_HASH_ON_START: "true"
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/portable-security-evidence"
          config="$RUNNER_TEMP/portable-scanner.yaml"
          printf '{}\n' > "$config"
          "$SYFT_BIN" --config "$config" scan "dir:$RUNNER_TEMP/portable-security-tree" \
            -o "syft-json=$evidence/windows-portable.syft.json" \
            -o "cyclonedx-json=$evidence/windows-portable.cyclonedx.json"
          "$GRYPE_BIN" --config "$config" "sbom:$evidence/windows-portable.syft.json" \
            --output json > "$evidence/windows-portable.grype.json"
          "$GRYPE_BIN" --config "$config" db status --output json > "$evidence/grype-db-status.json"
          python -B -I -S tools/windows_portable/artifact_security.py policy \
            --scan-input "$evidence/scan-input.json" \
            --syft "$evidence/windows-portable.syft.json" \
            --cyclonedx "$evidence/windows-portable.cyclonedx.json" \
            --grype "$evidence/windows-portable.grype.json" \
            --db-status "$evidence/grype-db-status.json" \
            --expected-syft-version 1.57.1 \
            --expected-grype-version 0.121.3 \
            --output "$evidence/artifact-security.json"

      - name: Retain final-artifact security evidence
        if: always()
        id: evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-portable-security-evidence
          path: ${{ runner.temp }}/portable-security-evidence
          if-no-files-found: error
          retention-days: 90

  sign_manifest:
    needs: [verify_unsigned, artifact_security]
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: ${{ inputs.environment_name }}
    outputs:
      signature_id: ${{ steps.signature.outputs.artifact-id }}
      signature_digest: ${{ steps.signature.outputs.artifact-digest }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:EXPECTED_SHA -cnotmatch '\A[0-9a-f]{40}\z' -or (git rev-parse HEAD).Trim() -cne $env:EXPECTED_SHA) {
            throw "Checkout did not resolve to the exact expected commit."
          }

      - name: Require immutable input artifact IDs
        shell: pwsh
        env:
          MANIFEST_ID: ${{ needs.verify_unsigned.outputs.manifest_id }}
          RECEIPT_ID: ${{ needs.verify_unsigned.outputs.receipt_id }}
          SECURITY_EVIDENCE_ID: ${{ needs.artifact_security.outputs.evidence_id }}
          SECURITY_EVIDENCE_DIGEST: ${{ needs.artifact_security.outputs.evidence_digest }}
        run: |
          foreach ($id in @($env:MANIFEST_ID, $env:RECEIPT_ID, $env:SECURITY_EVIDENCE_ID)) {
            if ($id -notmatch '\A[1-9][0-9]*\z') { throw "Missing exact release input artifact ID." }
          }
          if ($env:SECURITY_EVIDENCE_DIGEST -cnotmatch '\A[0-9a-f]{64}\z') {
            throw "Missing final-artifact security evidence digest."
          }

      - name: Download exact canonical manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify_unsigned.outputs.manifest_id }}
          path: ${{ runner.temp }}/portable-inputs
          skip-decompress: true
          digest-mismatch: error

      - name: Download exact verification receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify_unsigned.outputs.receipt_id }}
          path: ${{ runner.temp }}/portable-inputs
          skip-decompress: true
          digest-mismatch: error

      - name: Regenerate and compare manifest from the exact checkout
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          MANIFEST_DIGEST: ${{ needs.verify_unsigned.outputs.manifest_digest }}
          VERIFICATION_DIGEST: ${{ needs.verify_unsigned.outputs.receipt_digest }}
        run: |
          ./tools/windows_portable/release_update.ps1 -Stage PrepareSigning `
            -ExpectedSha $env:EXPECTED_SHA -ReleaseTag $env:RELEASE_TAG `
            -InputDir (Join-Path $env:RUNNER_TEMP "portable-inputs") `
            -OutputDir (Join-Path $env:RUNNER_TEMP "approved") `
            -ManifestDigest $env:MANIFEST_DIGEST -VerificationDigest $env:VERIFICATION_DIGEST

      - name: Sign approved manifest bytes
        shell: pwsh
        env:
          WINDOWS_UPDATE_SIGNING_KEY_XML: ${{ secrets.WINDOWS_UPDATE_SIGNING_KEY_XML }}
          MANIFEST_DIGEST: ${{ needs.verify_unsigned.outputs.manifest_digest }}
          VERIFICATION_DIGEST: ${{ needs.verify_unsigned.outputs.receipt_digest }}
        run: |
          ./tools/windows_portable/sign_verified_manifest.ps1 `
            -ManifestPath (Join-Path $env:RUNNER_TEMP "approved/manifest.json") `
            -ManifestDigest $env:MANIFEST_DIGEST -VerificationDigest $env:VERIFICATION_DIGEST `
            -OutFile (Join-Path $env:RUNNER_TEMP "approved/detached-signature.json")

      - name: Upload detached signature and receipt binding
        id: signature
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: detached-signature.json
          path: ${{ runner.temp }}/approved/detached-signature.json
          archive: false
          if-no-files-found: error

  package_attest:
    needs: [verify_unsigned, artifact_security, sign_manifest]
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      release_assets_id: ${{ steps.release_assets.outputs.artifact-id }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:EXPECTED_SHA -cnotmatch '\A[0-9a-f]{40}\z' -or (git rev-parse HEAD).Trim() -cne $env:EXPECTED_SHA) {
            throw "Checkout did not resolve to the exact expected commit."
          }

      - name: Require immutable input artifact IDs
        shell: pwsh
        env:
          BUNDLE_ID: ${{ needs.verify_unsigned.outputs.verified_bundle_id }}
          UPDATE_ID: ${{ needs.verify_unsigned.outputs.verified_update_id }}
          MANIFEST_ID: ${{ needs.verify_unsigned.outputs.manifest_id }}
          RECEIPT_ID: ${{ needs.verify_unsigned.outputs.receipt_id }}
          SIGNATURE_ID: ${{ needs.sign_manifest.outputs.signature_id }}
        run: |
          foreach ($id in @($env:BUNDLE_ID, $env:UPDATE_ID, $env:MANIFEST_ID, $env:RECEIPT_ID, $env:SIGNATURE_ID)) {
            if ($id -notmatch '\A[1-9][0-9]*\z') { throw "Missing exact release input artifact ID." }
          }

      - name: Download verified portable ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify_unsigned.outputs.verified_bundle_id }}
          path: ${{ runner.temp }}/portable-inputs
          skip-decompress: true
          digest-mismatch: error

      - name: Download verified unsigned update ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify_unsigned.outputs.verified_update_id }}
          path: ${{ runner.temp }}/portable-inputs
          skip-decompress: true
          digest-mismatch: error

      - name: Download exact canonical manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify_unsigned.outputs.manifest_id }}
          path: ${{ runner.temp }}/portable-inputs
          skip-decompress: true
          digest-mismatch: error

      - name: Download exact verification receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify_unsigned.outputs.receipt_id }}
          path: ${{ runner.temp }}/portable-inputs
          skip-decompress: true
          digest-mismatch: error

      - name: Download exact detached signature
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sign_manifest.outputs.signature_id }}
          path: ${{ runner.temp }}/portable-inputs
          skip-decompress: true
          digest-mismatch: error

      - name: Package and independently verify signed assets
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          MANIFEST_DIGEST: ${{ needs.verify_unsigned.outputs.manifest_digest }}
          VERIFICATION_DIGEST: ${{ needs.verify_unsigned.outputs.receipt_digest }}
          SIGNATURE_DIGEST: ${{ needs.sign_manifest.outputs.signature_digest }}
          VERIFIED_BUNDLE_ID: ${{ needs.verify_unsigned.outputs.verified_bundle_id }}
          VERIFIED_UPDATE_ID: ${{ needs.verify_unsigned.outputs.verified_update_id }}
        run: |
          ./tools/windows_portable/release_update.ps1 -Stage Package `
            -ExpectedSha $env:EXPECTED_SHA -ReleaseTag $env:RELEASE_TAG `
            -InputDir (Join-Path $env:RUNNER_TEMP "portable-inputs") `
            -OutputDir dist/release-assets `
            -ManifestDigest $env:MANIFEST_DIGEST -VerificationDigest $env:VERIFICATION_DIGEST `
            -SignatureDigest $env:SIGNATURE_DIGEST `
            -VerifiedBundleId $env:VERIFIED_BUNDLE_ID -VerifiedUpdateId $env:VERIFIED_UPDATE_ID

      - name: Attest release ZIP provenance
        if: inputs.prepare_release_assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/release-assets/frame-compare-portable-win-x64-${{ inputs.release_tag }}.zip
            dist/release-assets/frame-compare-update-win-x64-${{ inputs.release_tag }}.zip

      - name: Upload exact orchestrated release assets
        id: release_assets
        if: inputs.prepare_release_assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frame-compare-release-assets
          path: |
            dist/release-assets/frame-compare-portable-win-x64-${{ inputs.release_tag }}.zip
            dist/release-assets/frame-compare-portable-win-x64-${{ inputs.release_tag }}.zip.sha256
            dist/release-assets/frame-compare-update-win-x64-${{ inputs.release_tag }}.zip
            dist/release-assets/frame-compare-update-win-x64-${{ inputs.release_tag }}.zip.sha256
          if-no-files-found: error

      - name: Upload verified manual portable artifact
        if: '!inputs.prepare_release_assets'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frame-compare-portable-win-x64
          path: |
            dist/release-assets/frame-compare-portable-win-x64.zip
            dist/release-assets/frame-compare-portable-win-x64.zip.sha256
          if-no-files-found: error

      - name: Upload signed manual update artifact
        if: '!inputs.prepare_release_assets'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frame-compare-update-win-x64
          path: |
            dist/release-assets/frame-compare-update-win-x64-*.zip
            dist/release-assets/frame-compare-update-win-x64-*.zip.sha256
          if-no-files-found: error
