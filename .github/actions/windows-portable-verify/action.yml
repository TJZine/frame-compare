name: Verify unsigned Windows portable artifacts
description: Independently verify same-run portable inputs and emit the bounded signing input.
inputs:
  expected_sha:
    description: Exact commit checked out by the calling job
    required: true
  release_tag:
    description: Validated release tag, empty for verification runs
    required: false
    default: ""
  require_portable_authority:
    description: Rebuild the portable ZIP independently and require byte equality
    required: false
    default: "false"
  bundle_id:
    description: Immutable portable input artifact ID
    required: true
  bundle_digest:
    description: SHA-256 of the raw portable ZIP
    required: true
  update_id:
    description: Immutable unsigned update artifact ID
    required: true
  update_digest:
    description: SHA-256 of the raw unsigned update ZIP
    required: true
outputs:
  receipt_id:
    description: Immutable verification receipt artifact ID
    value: ${{ steps.receipt.outputs.artifact-id }}
  receipt_digest:
    description: SHA-256 of the verification receipt
    value: ${{ steps.receipt.outputs.artifact-digest }}
  manifest_id:
    description: Immutable canonical manifest artifact ID
    value: ${{ steps.manifest.outputs.artifact-id }}
  manifest_digest:
    description: SHA-256 of the canonical manifest bytes
    value: ${{ steps.manifest.outputs.artifact-digest }}
  verified_bundle_id:
    description: Immutable independently derived portable ZIP artifact ID
    value: ${{ steps.verified_bundle.outputs.artifact-id }}
  verified_update_id:
    description: Immutable source-verified unsigned update ZIP artifact ID
    value: ${{ steps.verified_update.outputs.artifact-id }}
runs:
  using: composite
  steps:
    - name: Require both immutable build artifact IDs
      shell: pwsh
      env:
        BUNDLE_ID: ${{ inputs.bundle_id }}
        UPDATE_ID: ${{ inputs.update_id }}
      run: |
        foreach ($id in @($env:BUNDLE_ID, $env:UPDATE_ID)) {
          if ($id -notmatch '\A[1-9][0-9]*\z') { throw "Missing exact build artifact ID." }
        }

    - name: Download exact portable input
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ inputs.bundle_id }}
        path: ${{ runner.temp }}/portable-inputs
        skip-decompress: true
        digest-mismatch: error

    - name: Download exact unsigned update input
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ inputs.update_id }}
        path: ${{ runner.temp }}/portable-inputs
        skip-decompress: true
        digest-mismatch: error

    - name: Setup host Python 3.13.17 for isolated authority
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13.17"

    - name: Setup uv for frozen lock export and offline wheel installation
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.8"
        enable-cache: false

    - name: Verify archive, exact source and compatibility
      shell: pwsh
      env:
        EXPECTED_SHA: ${{ inputs.expected_sha }}
        RELEASE_TAG: ${{ inputs.release_tag }}
        BUNDLE_DIGEST: ${{ inputs.bundle_digest }}
        UPDATE_DIGEST: ${{ inputs.update_digest }}
        REQUIRE_PORTABLE_AUTHORITY: ${{ inputs.require_portable_authority }}
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        # uv includes --output-file in the hashed header. Use the build’s
        # existing absolute output location in the hosted checkout to keep
        # the released updater compatibility fingerprint.
        $root = New-Item -ItemType Directory -Path "dist/frame-compare-portable-win-x64" -Force
        $requirements = Join-Path $root.FullName "requirements.lock.txt"
        python -B -I -S tools/windows_portable/portable_runtime.py export --output $requirements --commit-sha "$env:EXPECTED_SHA"
        ./tools/windows_portable/release_update.ps1 -Stage Verify `
          -ExpectedSha $env:EXPECTED_SHA -ReleaseTag $env:RELEASE_TAG `
          -InputDir (Join-Path $env:RUNNER_TEMP "portable-inputs") `
          -OutputDir (Join-Path $env:RUNNER_TEMP "verified") `
          -BundleDigest $env:BUNDLE_DIGEST -UpdateDigest $env:UPDATE_DIGEST `
          -RequirementsPath $requirements -RequirementsDigest (Get-FileHash -LiteralPath $requirements).Hash.ToLowerInvariant() `
          -RequirePortableAuthority:($env:REQUIRE_PORTABLE_AUTHORITY -ceq "true")

    - name: Upload independently derived portable ZIP
      if: inputs.require_portable_authority == 'true'
      id: verified_bundle
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: verified-portable.zip
        path: ${{ runner.temp }}/verified/verified-portable.zip
        archive: false
        if-no-files-found: error

    - name: Upload source-verified unsigned update ZIP
      if: inputs.require_portable_authority == 'true'
      id: verified_update
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: verified-update.zip
        path: ${{ runner.temp }}/verified/verified-update.zip
        archive: false
        if-no-files-found: error

    - name: Bind verified artifact IDs and digests
      if: inputs.require_portable_authority == 'true'
      shell: pwsh
      env:
        VERIFIED_BUNDLE_ID: ${{ steps.verified_bundle.outputs.artifact-id }}
        VERIFIED_BUNDLE_SHA256: ${{ steps.verified_bundle.outputs.artifact-digest }}
        VERIFIED_UPDATE_ID: ${{ steps.verified_update.outputs.artifact-id }}
        VERIFIED_UPDATE_SHA256: ${{ steps.verified_update.outputs.artifact-digest }}
      run: |
        $path = Join-Path $env:RUNNER_TEMP "verified/verification.json"
        $receipt = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json -AsHashtable
        if (
          $env:VERIFIED_BUNDLE_ID -cnotmatch '\A[1-9][0-9]*\z' -or
          $env:VERIFIED_UPDATE_ID -cnotmatch '\A[1-9][0-9]*\z' -or
          $env:VERIFIED_BUNDLE_ID -ceq $env:VERIFIED_UPDATE_ID -or
          $env:VERIFIED_BUNDLE_SHA256 -cne $receipt.bundle_sha256 -or
          $env:VERIFIED_UPDATE_SHA256 -cne $receipt.unsigned_update_sha256
        ) { throw "Verified artifacts do not match the verification receipt." }
        $receipt.portable_artifact_id = $env:VERIFIED_BUNDLE_ID
        $receipt.unsigned_update_artifact_id = $env:VERIFIED_UPDATE_ID
        $receipt | ConvertTo-Json -Compress | Set-Content -LiteralPath $path -Encoding utf8NoBOM

    - name: Upload canonical manifest
      id: manifest
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: manifest.json
        path: ${{ runner.temp }}/verified/manifest.json
        archive: false
        if-no-files-found: error

    - name: Upload verification receipt
      id: receipt
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: verification.json
        path: ${{ runner.temp }}/verified/verification.json
        archive: false
        if-no-files-found: error
