[project]
name = "frame-compare"
version = "2.0.0-dev"
description = "Video frame comparison and HDR tonemapping tool"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "TJZine" }]
keywords = ["video", "comparison", "hdr", "tonemapping", "vapoursynth"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.27.0",
    "anyio>=4.0.0",
    "numpy>=1.26.0",
    "natsort>=8.4.0",
    "pillow>=10.0.0",
    "msgspec>=0.18.0",
    "structlog>=24.0.0",
    "guessit>=3.8.0",
    "anitopy>=2.1.0",
    "tenacity>=8.2.0",
    "librosa>=0.11.0",
    "soundfile>=0.13.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    # Note: anyio includes its own pytest plugin (anyio.pytest_plugin)
    # Use @pytest.mark.anyio for async tests
    "respx>=0.21.0",
    "pyyaml>=6.0",
    "jsonschema>=4.20.0",
    "pyright>=1.1.350",
    "ruff>=0.3.0",
    "import-linter>=2.0",
]
vspreview = ["vspreview>=0.7.0"]
clipboard = ["pyperclip>=1.8.0"]

[project.scripts]
frame-compare = "frame_compare.cli_entry:app"

[project.urls]
Repository = "https://github.com/TJZine/frame-compare"
Documentation = "https://github.com/TJZine/frame-compare#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frame_compare"]

# =============================================================================
# PYRIGHT
# =============================================================================
[tool.pyright]
pythonVersion = "3.13"
pythonPlatform = "All"
typeCheckingMode = "strict"
include = ["src"]
exclude = ["**/__pycache__", "**/node_modules", ".venv"]
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true
reportUnusedFunction = true
reportPrivateUsage = true

# =============================================================================
# RUFF
# =============================================================================
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Function call in default argument (needed for Typer)
]

[tool.ruff.lint.isort]
known-first-party = ["frame_compare"]

# =============================================================================
# PYTEST
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: marks tests as unit tests (fast, isolated)",
    "integration: marks tests as integration tests",
    "e2e: marks end-to-end tests",
    "vs_required: marks tests that require VapourSynth",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests requiring network access",
    "tier_a: contract and security tests (no VS, no network)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# =============================================================================
# COVERAGE
# =============================================================================
[tool.coverage.run]
source = ["src/frame_compare"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 80

# =============================================================================
# IMPORT LINTER
# =============================================================================
[tool.importlinter]
root_package = "frame_compare"

[[tool.importlinter.contracts]]
name = "Layered Architecture"
type = "layers"
layers = [
    "frame_compare.cli_entry",
    "frame_compare.runner",
    "frame_compare.orchestration",
    "(frame_compare.analysis | frame_compare.render | frame_compare.services)",
    "frame_compare.vs",
    "frame_compare.config",
    "frame_compare.utils",
    "frame_compare.errors",
]

[[tool.importlinter.contracts]]
name = "Domain Independence"
type = "independence"
modules = [
    "frame_compare.analysis",
    "frame_compare.render",
    "frame_compare.services",
]
