# CLI Flags Contract
# Source of truth for all CLI flags - regenerate derived views with:
#   python scripts/generate_contract_views.py

version: "2.0"

flags:
  - id: FLAG_ROOT
    long: "--root"
    short: "-r"
    type: Path
    default: "."
    config_key: null
    help: "Workspace root directory"
    choices: null
    envvar: FRAME_COMPARE_ROOT

  - id: FLAG_CONFIG
    long: "--config"
    short: "-c"
    type: Path
    default: null
    config_key: null
    help: "Config file path"
    choices: null
    envvar: FRAME_COMPARE_CONFIG

  - id: FLAG_INPUT
    long: "--input"
    short: "-i"
    type: Path
    default: null
    config_key: paths.input_dir
    help: "Input directory override"
    choices: null
    envvar: null

  - id: FLAG_TM_PRESET
    long: "--tm-preset"
    short: "-p"
    type: str
    default: null
    config_key: color.preset
    help: "Tonemap preset (defers to config)"
    choices:
      - reference
      - filmic
      - contrast
      - bt2390_spec
      - spline
      - bright_lift
      - highlight_guard
    envvar: null

  - id: FLAG_TM_TARGET
    long: "--tm-target"
    short: "-t"
    type: int
    default: null
    config_key: color.target_nits
    help: "Target peak luminance (defers to config)"
    choices: null
    envvar: null

  - id: FLAG_TM_CURVE
    long: "--tm-curve"
    short: null
    type: str
    default: null
    config_key: color.tone_curve
    help: "Tone curve override"
    choices:
      - bt2390
      - spline
      - reinhard
      - mobius
      - linear
    envvar: null

  - id: FLAG_FRAME_COUNT
    long: "--frame-count"
    short: "-n"
    type: int
    default: null
    config_key: analysis.frame_count
    help: "Frames to capture (defers to config)"
    choices: null
    envvar: null

  - id: FLAG_SEED
    long: "--seed"
    short: "-s"
    type: int
    default: null
    config_key: analysis.random_seed
    help: "Random seed"
    choices: null
    envvar: null

  - id: FLAG_SKIP_ANALYSIS
    long: "--skip-analysis"
    short: null
    type: bool
    default: false
    config_key: null
    help: "Skip frame analysis; use uniform frame sampling with seed"
    choices: null
    envvar: null

  - id: FLAG_OVERLAY
    long: "--overlay"
    short: null
    type: str
    default: null
    config_key: screenshots.overlay_mode
    help: "Overlay mode (defers to config)"
    choices:
      - minimal
      - standard
      - diagnostic
      - none
    envvar: null

  - id: FLAG_NO_UPLOAD
    long: "--no-upload"
    short: null
    type: bool
    default: false
    config_key: "slowpics.auto_upload"  # Inverted: flag=True means auto_upload=False
    help: "Skip slow.pics upload"
    choices: null
    envvar: null

  - id: FLAG_NO_CACHE
    long: "--no-cache"
    short: null
    type: bool
    default: false
    config_key: null
    help: "Ignore cached metrics"
    choices: null
    envvar: null

  - id: FLAG_FROM_CACHE_ONLY
    long: "--from-cache-only"
    short: null
    type: bool
    default: false
    config_key: null
    help: "Use only cached snapshot"
    choices: null
    envvar: null

  - id: FLAG_WRITE_CONFIG
    long: "--write-config"
    short: null
    type: bool
    default: false
    config_key: null
    help: "Write resolved config and exit"
    choices: null
    envvar: null

  - id: FLAG_DIAGNOSE_PATHS
    long: "--diagnose-paths"
    short: null
    type: bool
    default: false
    config_key: null
    help: "Print path diagnostics as JSON"
    choices: null
    envvar: null

  - id: FLAG_QUIET
    long: "--quiet"
    short: "-q"
    type: bool
    default: false
    config_key: null
    help: "Suppress output"
    choices: null
    envvar: null

  - id: FLAG_VERBOSE
    long: "--verbose"
    short: "-v"
    type: bool
    default: false
    config_key: null
    help: "Debug output"
    choices: null
    envvar: null

  - id: FLAG_JSON
    long: "--json"
    short: null
    type: bool
    default: false
    config_key: null
    help: "JSON output mode"
    choices: null
    envvar: null

  - id: FLAG_NO_COLOR
    long: "--no-color"
    short: null
    type: bool
    default: false
    config_key: null
    help: "Disable colors"
    choices: null
    envvar: null

  - id: FLAG_SKIP_METADATA
    long: "--skip-metadata"
    short: null
    type: bool
    default: false
    config_key: null
    help: "Skip TMDB metadata lookup"
    choices: null
    envvar: null

  - id: FLAG_SKIP_DOVI
    long: "--skip-dovi"
    short: null
    type: bool
    default: false
    config_key: null
    help: "Skip Dolby Vision extraction"
    choices: null
    envvar: null

  - id: FLAG_FORCE_INTERACTIVE_ALIGNMENT
    long: "--force-interactive-alignment"
    short: null
    type: bool
    default: false
    config_key: audio_alignment.force_interactive
    help: "Force interactive alignment (implies audio_alignment.use_vspreview = true)"
    choices: null
    envvar: null
