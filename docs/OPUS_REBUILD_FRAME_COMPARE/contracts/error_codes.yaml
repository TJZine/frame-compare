# Error Codes Contract
# Source of truth for all error codes - regenerate derived views with:
#   python scripts/generate_contract_views.py

version: "1.0"

# Exit code mapping by error category
exit_codes:
  FC-1xxx: 2   # Configuration errors
  FC-2xxx: 3   # Dependency errors
  FC-3xxx: 4   # Input errors
  FC-4xxx: 5   # Processing errors
  FC-5xxx: 6   # Network errors
  FC-9xxx: 1   # Internal errors

errors:
  # ===========================================================================
  # Configuration Errors (FC-1xxx) - Exit Code 2
  # ===========================================================================
  FC-1001:
    name: CONFIG_NOT_FOUND
    exit_code: 2
    message_template: "Configuration file not found: {path}"
    hint: "Run 'frame-compare wizard' or create config/config.toml"

  FC-1002:
    name: CONFIG_PARSE_ERROR
    exit_code: 2
    message_template: "Failed to parse {path}: {details}"
    hint: "Check TOML syntax at the indicated line"

  FC-1003:
    name: CONFIG_VALIDATION_ERROR
    exit_code: 2
    message_template: "Invalid configuration: {fields}"
    hint: "Check field types and constraints"

  FC-1004:
    name: PRESET_NOT_FOUND
    exit_code: 2
    message_template: "Preset not found: {name}"
    hint: "Run 'frame-compare preset list' to see available"

  FC-1005:
    name: PRESET_INVALID
    exit_code: 2
    message_template: "Invalid preset file: {path}"
    hint: "Preset TOML syntax error"

  FC-1006:
    name: CONFIG_MIGRATION_ERROR
    exit_code: 2
    message_template: "Config migration failed: {details}"
    hint: "Check v1 config format or manually convert to v2 structure"

  # ===========================================================================
  # Dependency Errors (FC-2xxx) - Exit Code 3
  # ===========================================================================
  FC-2001:
    name: VAPOURSYNTH_NOT_FOUND
    exit_code: 3
    message_template: "VapourSynth not installed"
    hint: "Use Docker deployment or install VapourSynth R72+"

  FC-2002:
    name: VAPOURSYNTH_ERROR
    exit_code: 3
    message_template: "VapourSynth error: {details}"
    hint: "Run 'frame-compare doctor' for diagnostics"

  FC-2003:
    name: PLUGIN_NOT_FOUND
    exit_code: 3
    message_template: "VapourSynth plugin not found: {plugin}"
    hint: "Install {plugin} or use Docker deployment"

  FC-2004:
    name: LIBPLACEBO_ERROR
    exit_code: 3
    message_template: "libplacebo error: {details}"
    hint: "Verify libplacebo installation or use FFmpeg fallback"

  FC-2005:
    name: FFMPEG_NOT_FOUND
    exit_code: 3
    message_template: "FFmpeg not found in PATH"
    hint: "Install FFmpeg 6.0+"

  FC-2006:
    name: FFMPEG_ERROR
    exit_code: 3
    message_template: "FFmpeg error: {details}"
    hint: "Check FFmpeg output for details"

  FC-2007:
    name: DOVI_TOOL_NOT_FOUND
    exit_code: 3
    message_template: "dovi_tool not found"
    hint: "Install dovi_tool for Dolby Vision support"

  FC-2010:
    name: PYTHON_VERSION_ERROR
    exit_code: 3
    message_template: "Python version {version} not supported"
    hint: "Use Python 3.13+"

  # ===========================================================================
  # Input Errors (FC-3xxx) - Exit Code 4
  # ===========================================================================
  FC-3001:
    name: NO_VIDEOS_FOUND
    exit_code: 4
    message_template: "No video files found in {path}"
    hint: "Place *.mkv,*.mp4 files in the input directory"

  FC-3002:
    name: VIDEO_OPEN_ERROR
    exit_code: 4
    message_template: "Failed to open video: {path}"
    hint: "Check file path and format"

  FC-3003:
    name: VIDEO_CORRUPT
    exit_code: 4
    message_template: "Video file appears corrupt: {path}"
    hint: "Try re-encoding or different source"

  FC-3004:
    name: INSUFFICIENT_FRAMES
    exit_code: 4
    message_template: "Video has {count} frames, need at least {required}"
    hint: "Use a longer video or reduce frame_count"

  FC-3005:
    name: INCOMPATIBLE_VIDEOS
    exit_code: 4
    message_template: "Videos have incompatible properties"
    hint: "All videos must have same frame count and fps"

  FC-3006:
    name: DIR_NOT_FOUND
    exit_code: 4
    message_template: "Directory not found: {path}"
    hint: "Create the directory or check the path"

  FC-3007:
    name: DIR_NOT_WRITABLE
    exit_code: 4
    message_template: "Cannot write to directory: {path}"
    hint: "Check permissions"

  FC-3008:
    name: FILE_TOO_LARGE
    exit_code: 4
    message_template: "File exceeds size limit: {path}"
    hint: "Use smaller video or increase limit"

  FC-3009:
    name: PATH_ESCAPES_ROOT
    exit_code: 4
    message_template: "Path '{candidate}' escapes workspace root"
    hint: "Use relative paths within workspace"

  FC-3010:
    name: INVALID_SUBPROCESS_ARG
    exit_code: 4
    message_template: "Invalid character in argument: {arg}"
    hint: "Remove shell metacharacters from the argument"

  FC-3011:
    name: CONTROL_CHAR_IN_ARG
    exit_code: 4
    message_template: "Control character in argument: {arg}"
    hint: "Remove control characters from the argument"

  FC-3012:
    name: INVALID_PATH
    exit_code: 4
    message_template: "Invalid path: {path}"
    hint: "Remove invalid characters (null bytes, control chars) from path"

  # ===========================================================================
  # Processing Errors (FC-4xxx) - Exit Code 5
  # ===========================================================================
  FC-4001:
    name: FRAME_EXTRACTION_ERROR
    exit_code: 5
    message_template: "Failed to extract frame {frame} from {clip}"
    hint: "Check video integrity"

  FC-4002:
    name: METRICS_CALCULATION_ERROR
    exit_code: 5
    message_template: "Failed to calculate metrics: {details}"
    hint: "Check VapourSynth logs"

  FC-4003:
    name: TONEMAP_ERROR
    exit_code: 5
    message_template: "Tonemapping failed: {details}"
    hint: "Try different preset or disable tonemapping"

  FC-4004:
    name: RENDER_ERROR
    exit_code: 5
    message_template: "Screenshot rendering failed"
    hint: "Check disk space and permissions"

  FC-4005:
    name: AUDIO_ALIGNMENT_ERROR
    exit_code: 5
    message_template: "Audio alignment failed: {details}"
    hint: "Try manual alignment or disable audio alignment"

  FC-4006:
    name: CACHE_CORRUPTION_ERROR
    exit_code: 5
    message_template: "Cache file corrupt: {path}"
    hint: "Delete cache file and retry"

  FC-4007:
    name: CACHE_VERSION_MISMATCH
    exit_code: 5
    message_template: "Cache version mismatch"
    hint: "Clear cache with --no-cache"

  FC-4010:
    name: MEMORY_ERROR
    exit_code: 5
    message_template: "Out of memory during processing"
    hint: "Reduce frame count or video resolution"

  FC-4011:
    name: TIMEOUT_ERROR
    exit_code: 5
    message_template: "Processing timed out"
    hint: "Check for infinite loops or increase timeout"

  FC-4012:
    name: SELECTION_ERROR
    exit_code: 5
    message_template: "Frame selection failed: {reason}"
    hint: "Reduce frame count or use different selection mode"

  FC-4013:
    name: ENCODING_ERROR
    exit_code: 5
    message_template: "Failed to encode image: {path}"
    hint: "Check disk space and file permissions"

  FC-4014:
    name: OVERLAY_ERROR
    exit_code: 5
    message_template: "Failed to apply overlay: {details}"
    hint: "Check font path and image format"

  FC-4015:
    name: SOURCE_LOAD_ERROR
    exit_code: 5
    message_template: "Failed to load video source: {path}"
    hint: "Check file format and VapourSynth plugins"

  FC-4016:
    name: METADATA_ERROR
    exit_code: 5
    message_template: "Metadata operation failed: {details}"
    hint: "Check file format or try --skip-metadata"

  FC-4017:
    name: REPORT_ERROR
    exit_code: 5
    message_template: "Report generation failed: {details}"
    hint: "Check disk space and permissions"

  FC-4018:
    name: DOVI_ERROR
    exit_code: 5
    message_template: "Dolby Vision extraction failed: {details}"
    hint: "Check dovi_tool installation or use --skip-dovi"

  # ===========================================================================
  # Network Errors (FC-5xxx) - Exit Code 6
  # ===========================================================================
  FC-5001:
    name: NETWORK_UNREACHABLE
    exit_code: 6
    message_template: "Network unreachable"
    hint: "Check internet connection"

  FC-5002:
    name: SLOWPICS_ERROR
    exit_code: 6
    message_template: "slow.pics upload failed: {details}"
    hint: "Try again or use --no-upload"

  FC-5003:
    name: SLOWPICS_RATE_LIMITED
    exit_code: 6
    message_template: "slow.pics rate limited"
    hint: "Wait and retry"

  FC-5004:
    name: SLOWPICS_UNAVAILABLE
    exit_code: 6
    message_template: "slow.pics service unavailable"
    hint: "Try again later"

  FC-5005:
    name: TMDB_ERROR
    exit_code: 6
    message_template: "TMDB API error: {details}"
    hint: "Check API key or use --skip-metadata"

  FC-5006:
    name: TMDB_RATE_LIMITED
    exit_code: 6
    message_template: "TMDB rate limited"
    hint: "Wait and retry"

  FC-5007:
    name: NETWORK_TIMEOUT
    exit_code: 6
    message_template: "Request timed out"
    hint: "Check connection or increase timeout"

  FC-5008:
    name: SSL_ERROR
    exit_code: 6
    message_template: "SSL certificate error"
    hint: "Check system time and certificates"

  # Security policy errors
  FC-5010:
    name: HTTPS_REQUIRED
    exit_code: 6
    message_template: "HTTPS required for external requests"
    hint: "External URLs must use https:// scheme"

  FC-5011:
    name: HOST_NOT_ALLOWED
    exit_code: 6
    message_template: "Request blocked to unauthorized host: {host}"
    hint: "Only slow.pics and api.themoviedb.org are allowed"

  # ===========================================================================
  # Internal Errors (FC-9xxx) - Exit Code 1
  # ===========================================================================
  FC-9001:
    name: INTERNAL_ERROR
    exit_code: 1
    message_template: "Internal error: {details}"
    hint: "Please report this bug"

  FC-9002:
    name: ASSERTION_FAILED
    exit_code: 1
    message_template: "Assertion failed: {details}"
    hint: "Please report this bug"

  FC-9003:
    name: UNEXPECTED_STATE
    exit_code: 1
    message_template: "Unexpected state: {details}"
    hint: "Please report this bug"
